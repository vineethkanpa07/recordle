# Render reads this file to set up the site ("New" > "Blueprint" in the Render dashboard).
services:
  - type: web
    name: recordle
    runtime: python
    plan: free
    region: virginia                # same area as the Neon database (AWS US East 1)
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --bind 0.0.0.0:$PORT
    healthCheckPath: /login
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: MUSICBOARD_SECRET        # signs login cookies; Render makes a random one
        generateValue: true
      - key: MUSICBOARD_DEBUG
        value: "0"
      - key: DATABASE_URL             # paste your Neon connection string when Render asks
        sync: false
